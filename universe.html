<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Новая Вселенная - Made in Heaven</title>
    
    <!-- Подключаем основной стиль, если он нужен -->
    <link rel="stylesheet" href="css/style.css">

    <style>
        /* Стили специфичные для этой страницы */
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #030008; /* Глубокий темный фон */
            color: #ffffff;
            font-family: 'Arial', sans-serif; 
            overflow: hidden; /* Убираем скролл */
        }

        /* 1. БЕЛАЯ ВСПЫШКА: Появляется мгновенно при загрузке страницы */
        .white-flash {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: #ffffff;
            z-index: 9999;
            /* Вспышка плавно исчезает за 3 секунды */
            animation: fadeOutFlash 3s ease-in-out forwards;
            pointer-events: none; 
        }

        @keyframes fadeOutFlash {
            0% { opacity: 1; }
            20% { opacity: 1; }
            100% { opacity: 0; display: none; }
        }

        /* 2. КОСМИЧЕСКИЙ ФОН */
        .space-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: radial-gradient(circle at center, #1e0945 0%, #000000 100%);
            z-index: 1;
        }

        /* 3. ЭФФЕКТ УСКОРЕНИЯ ВРЕМЕНИ (Вращающиеся звезды) */
        .stars {
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: transparent;
            background-image: 
                radial-gradient(2px 2px at 20px 30px, #ffffff, rgba(0,0,0,0)),
                radial-gradient(2px 2px at 40px 70px, #e1c4ff, rgba(0,0,0,0)),
                radial-gradient(2px 2px at 50px 160px, #ffffff, rgba(0,0,0,0)),
                radial-gradient(2px 2px at 90px 40px, #ffffff, rgba(0,0,0,0)),
                radial-gradient(2px 2px at 130px 80px, #c4d0ff, rgba(0,0,0,0)),
                radial-gradient(2px 2px at 160px 120px, #ffffff, rgba(0,0,0,0));
            background-repeat: repeat;
            background-size: 200px 200px;
            z-index: 2;
            animation: timeAcceleration 15s linear infinite;
        }

        @keyframes timeAcceleration {
            0% { transform: rotate(0deg) scale(1); }
            50% { transform: rotate(180deg) scale(1.5); }
            100% { transform: rotate(360deg) scale(1); }
        }

        /* 4. ОСНОВНОЙ КОНТЕНТ (Текст и кнопка) */
        .content-container {
            position: relative;
            z-index: 10;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            text-align: center;
            padding: 0 20px;
            /* Появляется плавно после вспышки */
            opacity: 0;
            animation: fadeInContent 4s ease-in-out 1.5s forwards;
        }

        @keyframes fadeInContent {
            to { opacity: 1; }
        }

        h1.universe-title {
            font-size: 4rem;
            text-transform: uppercase;
            letter-spacing: 8px;
            margin-bottom: 20px;
            text-shadow: 0 0 20px #b666d2, 0 0 40px #ffffff;
        }

        p.universe-lore {
            font-size: 1.3rem;
            max-width: 800px;
            line-height: 1.6;
            margin-bottom: 30px;
            color: #e5e5e5;
            text-shadow: 0 0 10px #000;
        }

        p.pucci-quote {
            font-style: italic;
            font-size: 1.5rem;
            color: #e3a8ff;
            margin-bottom: 50px;
        }

        /* Кнопка возврата */
        .reset-btn {
            padding: 15px 40px;
            font-size: 1.2rem;
            color: #fff;
            background: transparent;
            border: 2px solid #b666d2;
            border-radius: 5px;
            text-decoration: none;
            text-transform: uppercase;
            letter-spacing: 3px;
            transition: all 0.3s ease;
            box-shadow: 0 0 15px rgba(182, 102, 210, 0.4);
        }

        .reset-btn:hover {
            background: #b666d2;
            box-shadow: 0 0 30px #b666d2, inset 0 0 10px #fff;
            transform: scale(1.05);
        }

        .bio-overlay {
            position: fixed !important;
            top: 0 !important;
            left: 0 !important;
            width: 100vw !important;
            height: 100vh !important;
            background: rgba(5, 5, 8, 0.85) !important;
            backdrop-filter: blur(8px) !important;
            z-index: 999999 !important;
            display: flex !important;
            justify-content: center !important;
            align-items: center !important;
            opacity: 0 !important;
            visibility: hidden !important;
            pointer-events: none !important;
            transition: opacity 0.3s ease, visibility 0.3s ease !important;
            overflow-y: auto !important;
            padding: 20px !important;
            box-sizing: border-box !important;
        }

        .bio-overlay.active {
            opacity: 1 !important;
            visibility: visible !important;
            pointer-events: auto !important;
        }

        .bio-modal {
            position: relative !important;
            width: 100% !important;
            max-width: 850px !important;
            max-height: 90vh !important;
            background-color: #0c0b10 !important;
            border: 2px solid #ff0055 !important;
            box-shadow: 0 0 40px rgba(0, 0, 0, 0.9), 0 0 30px rgba(255, 0, 85, 0.4) !important;
            padding: 30px !important;
            box-sizing: border-box !important;
            overflow-y: auto !important;
            margin: auto !important;
            transform: scale(0.9);
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .bio-overlay.active .bio-modal {
            transform: scale(1) !important;
        }
    </style>
</head>
<body>

    <!-- Эффект белой вспышки -->
    <div class="white-flash"></div>

    <!-- Задний фон с космосом -->
    <div class="space-bg"></div>
    <div class="stars"></div>

    <!-- Текст и кнопка -->
    <div class="content-container">
        <h1 class="universe-title">Новая Вселенная</h1>
        
        <p class="universe-lore">
            Время завершило свой цикл. Гравитация привела мир в точку сингулярности, и вселенная переродилась. 
            Теперь каждое живое существо подсознательно знает свою судьбу. Это и есть истинное счастье.
        </p>

        <p class="pucci-quote">«Два шага... Ты опоздал всего на два шага.»</p>

        <!-- Ссылка на главную страницу -->
        <a href="index.html" class="reset-btn">Вернуться в старый мир</a>
    </div>

    <!-- Подключение JS (убедись, что в main.js нет запуска видео при загрузке этой страницы) -->

    <!-- Полноэкранный блок для видео Пуччи -->
<div id="pucci-overlay">
    <!-- Убедись, что файл pucci-mih.mp4 лежит в правильной папке -->
    <video id="pucci-video" src="video/pucci-mih.mp4" playsinline></video>
</div>

<!-- Аудио для новой вселенной (Crucified) -->
<audio id="universe-music" src="sound/Crucified - Army Of Lovers.mp3" autoplay loop preload="auto"></audio>

<!-- Контейнер для космических тел -->
<div id="cosmic-system">
    <div class="celestial-body sun"></div>
    <div class="celestial-body moon"></div>
</div>

<script>
        const universeMusic = document.getElementById('universe-music');
        const pucciVideo = document.getElementById('pucci-video');
        universeMusic.volume = 0.6;

        // При запуске пасхалки Made in Heaven глушим фоновую музыку.
        pucciVideo.addEventListener('play', () => {
            universeMusic.muted = true;
        });

        // Возвращаем звук после завершения пасхалки.
        pucciVideo.addEventListener('ended', () => {
            universeMusic.muted = false;
        });

        // Запускаем музыку после первого действия, если браузер заблокировал autoplay.
        document.addEventListener('click', () => universeMusic.play(), { once: true });
        document.addEventListener('keydown', () => universeMusic.play(), { once: true });
    </script>
    <script src="js/main.js"></script>
</body>
</html>
